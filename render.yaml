# Render "Blueprint" — creates one Web Service + one Postgres database.
# In the Render dashboard: New -> Blueprint -> point at this repo.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: usc-emba-tailgate-db
    plan: free
    databaseName: tailgate
    user: tailgate

services:
  - type: web
    name: usc-emba-tailgate
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: usc-emba-tailgate-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.11.0
